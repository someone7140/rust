
[package]
name = "government-program-analytics-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
 
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
toasty = { version = "0.11.0", features = ["postgresql"] }
toasty-cli = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v7", "serde"] }
entity = { path = "./entity" }

[workspace]
members = [".", "entity", "db_migration", "data_import_batch"]
